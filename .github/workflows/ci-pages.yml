name: Futebol CI and Pages preparation

on:
  pull_request:
  push:
    branches:
      - codex/futebol-mvp
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/futebol/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/futebol install --frozen-lockfile

      - name: Lint
        run: pnpm --dir apps/futebol lint

      - name: Typecheck
        run: pnpm --dir apps/futebol typecheck

      - name: Test
        run: pnpm --dir apps/futebol test

      - name: Test bundle security and Pages assembly
        run: |
          pnpm --dir apps/futebol test:bundle-security
          node --test scripts/prepare-pages.test.mjs

      - name: Build Futebol
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm --dir apps/futebol build

      - name: Assemble root and Futebol site
        run: node scripts/prepare-pages.mjs

      - name: Upload validated site preview
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview
          path: _site
          if-no-files-found: error

  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated site preview
        uses: actions/download-artifact@v4
        with:
          name: pages-preview
          path: _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
